# ==============================================================================
# CHECKS
# ==============================================================================
# This repo is shell / zsh / make, not Python: no unit-test framework - the
# workflow runs static checks over the files, and three suites that run the code
# itself, on every push.
#   - shellcheck on real shell scripts (cheatsheets/*.sh are fcheat data files
#     parsed by awk, not executable shell — excluded, the socle's and the
#     packs' alike)
#   - zsh -n on all zsh config files (syntax only, nothing is executed)
#   - .ps1 files stay 100% ASCII: PowerShell 5.1 reads a BOM-less script as
#     Windows-1252, where one non-ASCII byte (an em-dash) becomes a string
#     delimiter and breaks the whole file's parse
#   - make on the gmake Makefile: reading it parses every include — the
#     socle's make/*.mk and every pack's make/*.mk — then the help menu is
#     asserted (expected targets present, no doc drift between the
#     *_commands.sh cheatsheets and gmake help). The same menu is then read
#     with PACKS_DIR pointing at an empty folder, which is what an instance
#     without the pack looks like: its targets are gone, and nothing offers
#     to install it — a pack arrives from Windows, by `.\wsl.ps1 add_pack` or
#     by being chosen while the instance is built
#   - documentation coverage: every make/*.mk module must have a doc page — in
#     docs/make/ for the socle, inside its own pack for a pack module — linked
#     from the README index and listed in the README project tree; every gmake
#     target must appear in a cheatsheet; every .github/workflows/*.yml must be
#     named in the README
#   - templates.tsv format: every row must have 4 tab-separated columns and a
#     known tool (copier/cruft/ccds). The catalog is the python pack's, and its
#     path follows it. The picker skips a malformed row and warns on stderr, but
#     only when someone runs fnew - this check never misses one
#   - the docs and the menu say the same words (tests/doc-drift.sh): every
#     command wsl.ps1 knows, looked for in the README table, the commands page
#     and its sample menu. It found five drifted rows the day it was written
#
# The second job, on windows-latest, is the one that RUNS the code instead of
# reading it, because that is where PowerShell and wsl.exe are. Three suites,
# none of which needs an instance, a console or Docker Desktop:
#   - tests/menu-test.ps1        the arrow menu, driven by a scripted keyboard:
#                                wrapping, Escape, digits, the cursor read back
#                                after the block is drawn (the bug that made
#                                every arrow stack one more copy of the list)
#   - tests/packs-select-test.ps1  the checklist and what it applies: what
#                                adding, removing, cancelling and an empty list
#                                mean, the order the packs move in, where a
#                                failure stops, and that a value handed back
#                                does not carry the output of what produced it
#   - tests/build-question-test.sh  build's questions and its failure path, with
#                                a stand-in docker on the PATH (tests/fake-docker/)
#                                that hands the import a file which is not a tar
# Every bug the scripts themselves have had was caught here, and none of these
# checks can be replaced by reading the files.

name: Checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Shellcheck (real shell scripts)
        run: |
          find . -type f -name '*.sh' \
            -not -path './zsh/cheatsheets/*' \
            -not -path './packs/*/cheatsheets/*' -print0 |
            xargs -0 -r shellcheck

      - name: Zsh syntax (zsh -n, no execution)
        run: |
          # packs/ too: a pack may ship zsh files of its own (the shell face of
          # what it installs), and nothing else would read them.
          find zsh packs -type f \( -name '*.zsh' -o -name '.zshrc' \) -print0 |
            xargs -0 -r -n1 zsh -n

      - name: PowerShell scripts (ASCII only)
        run: |
          # tr deletes every ASCII byte: whatever is left is not ASCII. A BOM
          # would be flagged too, which is the intended reading of the rule.
          # find, not a ./*.ps1 glob: the rule must cover the whole tree, and a
          # root glob would silently stop checking anything below it.
          bad=0
          while IFS= read -r -d '' f; do
            if [ -n "$(LC_ALL=C tr -d '\000-\177' < "$f")" ]; then
              echo "::error file=${f}::non-ASCII byte found - keep .ps1 files 100% ASCII"
              bad=1
            fi
          done < <(find . -type f -name '*.ps1' -not -path './.git/*' -print0)
          exit $bad

      - name: Makefile parse + help menu
        run: |
          # The menu is what the repository carries: the socle's targets and
          # every pack's, since a pack's folder is right there in packs/. The
          # steps below compare the cheatsheets against it.
          make -f zsh/gmake/Makefile help |
            sed 's/\x1b\[[0-9;]*m//g' > help.txt
          missing=0
          for target in test test-fast test-functional test-gcp \
                        lint lint-py lint-sh lint-format \
                        copier_project cruft_project \
                        cloudrun_deploy bigquery_show vm_create \
                        gcp_project_list gh_pr_create docker_build_local; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::target '${target}' missing from gmake help"
              missing=1
            }
          done
          exit $missing

      - name: A pack's targets follow its folder
        run: |
          # What an instance without the pack looks like. The folder is the
          # whole switch, so pointing PACKS_DIR at an empty one is the same
          # thing as a machine where no pack was ever added: no gate to force,
          # no variable to set, nothing to keep in step by hand.
          mkdir -p /tmp/no-packs
          make -f zsh/gmake/Makefile PACKS_DIR=/tmp/no-packs help |
            sed 's/\x1b\[[0-9;]*m//g' > help-bare.txt
          bad=0
          if grep -qE '^  (gcp_auth_cli|cloudrun_deploy|vm_create|bigquery_show|gcs_list_buckets)[[:space:]]' help-bare.txt; then
            echo "::error::a pack target is in the menu without the pack's folder"
            bad=1
          fi
          # The way in is not a target any more, and neither is the way out:
          # a pack is installed and removed from Windows, by wsl.ps1.
          if grep -qE '^  (gcp_install|gcp_uninstall)[[:space:]]' help-bare.txt; then
            echo "::error::gcp_install/gcp_uninstall are gone - a pack arrives from Windows"
            bad=1
          fi
          # A pack's targets go with its folder, the scaffolding ones as much as
          # the python ones: lint and the test lanes live in
          # packs/python/make/*.mk, the three *_project targets in
          # packs/scaffold/make/*.mk. Their absence here is what an instance
          # without the packs looks like - and scaffold comes with python, so a
          # bare instance has neither.
          if grep -qE '^  (lint|lint-py|lint-sh|lint-format|test|test-fast|test-functional|test-gcp|copier_project|cruft_project|ccds_project)[[:space:]]' help-bare.txt; then
            echo "::error::a scaffolding or python pack target is in the menu without the pack's folder"
            bad=1
          fi
          # The project targets came out of the socle with the devops pack - they
          # build, push and configure ONE project, and an instance whose folders
          # are empty has none. Nothing of them may stay behind here.
          if grep -qE '^  (env_global_enable|env_project_enable|docker_build_local|docker_run_local|gh_pr_create|gh_pr_toreview|gh_pr_wip|gh_pr_ls)[[:space:]]' help-bare.txt; then
            echo "::error::a devops pack target is in the menu without the pack's folder"
            bad=1
          fi
          # And the socle loses nothing to an empty packs folder
          for target in help packs_list; do
            grep -q "^  ${target}[[:space:]]" help-bare.txt || {
              echo "::error::socle target '${target}' missing from the menu with no pack"
              bad=1
            }
          done
          exit $bad

      - name: No pack redefines a socle macro
        run: |
          # The socle's modules are read first and the packs' after, so a pack's
          # own `define check_vars` would win in silence and every target that
          # calls it - its neighbours' included - would lose its check. A comment
          # cannot notice that; this can.
          bad=0
          for macro in check_vars confirm_action; do
            if grep -rln "^define $macro$" packs/*/make/*.mk 2>/dev/null | grep -q .; then
              echo "::error::a pack defines $macro - that macro is the socle's (zsh/gmake/make/macros.mk)"
              bad=1
            fi
          done
          exit $bad

      - name: packs_list lists what the user chose
        run: |
          # A pack marked invisible is in no list, this one included: it is a
          # shared dependency, and the command answers "what did I ask for?".
          # Played on a folder of its own, so that the repository's own packs
          # cannot make the check pass by accident.
          mkdir -p /tmp/packs-list/asked /tmp/packs-list/hidden
          printf 'PACK_DESCRIPTION := The one the user chose\n' > /tmp/packs-list/asked/pack.conf
          printf 'PACK_DESCRIPTION := The one nobody chooses\nPACK_VISIBLE := no\n' > /tmp/packs-list/hidden/pack.conf
          make -f zsh/gmake/Makefile PACKS_DIR=/tmp/packs-list packs_list > list.txt
          bad=0
          grep -q "asked" list.txt || { echo "::error::packs_list dropped a pack the user chose"; bad=1; }
          grep -q "hidden" list.txt && { echo "::error::packs_list listed a pack marked PACK_VISIBLE := no"; bad=1; }
          # And the other state, reachable when a removal stopped half way: a
          # dependency left alone. It says so rather than print the header over
          # nothing, which would read as a command that found no pack at all.
          rm -rf /tmp/packs-list/asked
          make -f zsh/gmake/Makefile PACKS_DIR=/tmp/packs-list packs_list > list-only.txt
          grep -q "Nothing you chose" list-only.txt || {
            echo "::error::packs_list does not say what is left when only a dependency is installed"
            bad=1
          }
          exit $bad

      - name: Cheatsheet doc drift (*_commands.sh vs gmake help)
        run: |
          # Comment lines are skipped, as the picker itself does: a sheet's
          # header documents nothing, and prose in it can name a target without
          # offering it - `# requires: gcloud`, or a sentence about the menu.
          grep -hvE '^[[:space:]]*#' zsh/cheatsheets/*_commands.sh \
                                       packs/*/cheatsheets/*_commands.sh |
            grep -oE 'gmake [a-zA-Z_-]+' |
            awk '{print $2}' | sort -u > documented.txt
          missing=0
          while read -r target; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::'${target}' documented in a *_commands.sh cheatsheet but missing from gmake help"
              missing=1
            }
          done < documented.txt
          exit $missing

      - name: Documentation coverage
        run: |
          missing=0
          # A module is fully documented when: its doc page exists, the README
          # index links it, and the README tree lists the .mk file
          for mk in zsh/gmake/make/*.mk; do
            name=$(basename "$mk" .mk)
            [ -f "docs/make/${name}.md" ] || {
              echo "::error::module '${name}' has no doc page (docs/make/${name}.md)"
              missing=1
            }
            grep -q "docs/make/${name}.md" README.md || {
              echo "::error::doc page of module '${name}' not linked from the README index"
              missing=1
            }
            grep -q "${name}.mk" README.md || {
              echo "::error::'${name}.mk' missing from the README project structure tree"
              missing=1
            }
          done
          # No orphan doc pages either
          for doc in docs/make/*.md; do
            name=$(basename "$doc" .md)
            [ -f "zsh/gmake/make/${name}.mk" ] || {
              echo "::error::orphan doc page: ${doc} has no matching module"
              missing=1
            }
          done
          # A pack documents itself inside the pack, so that it stays one
          # folder that moves as a whole. The README links the pack, not each
          # of its pages - but a page that documents no module still has to be
          # reachable, or it is a page nobody will ever open.
          for pack_dir in packs/*/; do
            pack=$(basename "$pack_dir")
            # A pack's modules, and only those: the way in is a script at the
            # root now, not a module, so make/ is the whole of what it offers.
            for mk in "$pack_dir"make/*.mk; do
              [ -f "$mk" ] || continue
              name=$(basename "$mk" .mk)
              [ -f "${pack_dir}docs/${name}.md" ] || {
                echo "::error::pack '${pack}': module '${name}' has no doc page (${pack_dir}docs/${name}.md)"
                missing=1
              }
            done
            for doc in "$pack_dir"docs/*.md; do
              name=$(basename "$doc" .md)
              [ -f "${pack_dir}make/${name}.mk" ] || grep -q "$doc" README.md || {
                echo "::error::orphan pack page: ${doc} documents no module and the README does not link it"
                missing=1
              }
            done
          done
          # Every docs/ folder the README names must exist: a renamed directory
          # used to survive unnoticed (docs/gcp/ stayed named in the README
          # long after its page had moved out of it)
          grep -oE 'docs/[a-z_]+/' README.md | sort -u > readme_docs.txt
          while read -r d; do
            [ -d "$d" ] || {
              echo "::error::README names '${d}', which does not exist"
              missing=1
            }
          done < readme_docs.txt
          # Every target visible in gmake help (except the menu itself) must
          # be documented in a *_commands.sh cheatsheet
          awk '/^  /{print $1}' help.txt | grep -vx -e help -e make > help_targets.txt
          # Same cut as the drift check: what the picker offers is what has to
          # document the menu, comments excluded.
          grep -hvE '^[[:space:]]*#' zsh/cheatsheets/*_commands.sh \
                                       packs/*/cheatsheets/*_commands.sh > sheet_lines.txt
          while read -r target; do
            grep -q "gmake ${target}\b" sheet_lines.txt || {
              echo "::error::target '${target}' not documented in any *_commands.sh cheatsheet"
              missing=1
            }
          done < help_targets.txt
          # Every workflow must be named in the README, so the CI section there
          # cannot silently lose one (same rule as the make/*.mk modules)
          for wf in .github/workflows/*.yml; do
            name=$(basename "$wf")
            grep -q "$name" README.md || {
              echo "::error::workflow '${name}' is not named in the README"
              missing=1
            }
          done
          exit $missing

      - name: The docs and the menu say the same words
        run: bash tests/doc-drift.sh

      - name: Template catalog integrity (templates.tsv)
        run: |
          awk -F'\t' '
            /^[[:space:]]*(#|$)/ { next }
            {
              sub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              if (NF != 4) {
                print "Malformed row (4 tab-separated columns expected): " $0
                bad = 1
              } else if ($2 !~ /^(copier|cruft|ccds)$/) {
                print "Unknown tool: " $2 " (expected copier, cruft or ccds): " $0
                bad = 1
              }
            }
            END { exit bad }
          ' packs/python/cheatsheets/templates.tsv

  # The suites that run the code. They are the only checks here that have ever
  # caught a bug in the scripts themselves - a menu that stacked copies of
  # itself, a value that swallowed what the instance printed, an exit code that
  # said 0 on a failure - and none of them needs an instance, a console or
  # Docker Desktop, so they are free to run on every push.
  tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The answers come from the .answers file beside each suite, not from a
      # copy spelled out here: the numbered prompt reads them when there is no
      # console, which is what a runner is, and a second copy of the list is a
      # copy that drifts. It did - this step still listed the answers of the day
      # it was written, and went on passing while the suite grew a scenario.

      - name: The arrow menu, driven by a scripted keyboard
        shell: bash
        run: powershell -NoProfile -File tests/menu-test.ps1 < tests/menu-test.answers

      - name: The pack checklist, and what it applies
        shell: bash
        run: powershell -NoProfile -File tests/packs-select-test.ps1 < tests/packs-select-test.answers

      - name: build's questions, with a stand-in docker
        shell: bash
        run: bash tests/build-question-test.sh
