# ==============================================================================
# STATIC CHECKS
# ==============================================================================
# This repo is shell / zsh / make, not Python: no unit-test framework — the
# workflow only runs the standard static checks, on every push.
#   - shellcheck on real shell scripts (cheatsheets/*.sh are fcheat data files
#     parsed by awk, not executable shell — excluded)
#   - zsh -n on all zsh config files (syntax only, nothing is executed)
#   - make on the global makefile: reading it parses every make/*.mk include,
#     then the help menu is asserted (expected targets present, no doc drift
#     between make_commands.sh and gmake help)
#   - templates.tsv format: fnew's awk silently skips malformed rows (NF < 4),
#     so a broken line would just disappear from the picker — validate here

name: Static checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Shellcheck (real shell scripts)
        run: |
          find . -type f -name '*.sh' -not -path './zsh/cheatsheets/*' -print0 |
            xargs -0 -r shellcheck

      - name: Zsh syntax (zsh -n, no execution)
        run: |
          find zsh -type f \( -name '*.zsh' -o -name '.zshrc' \) -print0 |
            xargs -0 -r -n1 zsh -n

      - name: Makefile parse + help menu
        run: |
          make -f zsh/cheatsheets/global_makefile.mk help |
            sed 's/\x1b\[[0-9;]*m//g' > help.txt
          missing=0
          for target in test test-fast test-functional test-gcp \
                        lint lint-py lint-sh lint-format \
                        copier_project cruft_project \
                        cloudrun_deploy bigquery_show vm_create \
                        gcp_project_list gh_pr_create docker_build_local; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::target '${target}' missing from gmake help"
              missing=1
            }
          done
          exit $missing

      - name: Cheatsheet doc drift (make_commands.sh vs gmake help)
        run: |
          grep -oE 'gmake [a-zA-Z_-]+' zsh/cheatsheets/make_commands.sh |
            awk '{print $2}' | sort -u > documented.txt
          missing=0
          while read -r target; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::'${target}' documented in make_commands.sh but missing from gmake help"
              missing=1
            }
          done < documented.txt
          exit $missing

      - name: Template catalog integrity (templates.tsv)
        run: |
          awk -F'\t' '
            /^[[:space:]]*(#|$)/ { next }
            {
              sub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              if (NF != 4) {
                print "Malformed row (4 tab-separated columns expected): " $0
                bad = 1
              } else if ($2 != "copier" && $2 != "cruft") {
                print "Unknown tool '"'"'" $2 "'"'"' (expected copier or cruft): " $0
                bad = 1
              }
            }
            END { exit bad }
          ' zsh/cheatsheets/templates.tsv
