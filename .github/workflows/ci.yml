# ==============================================================================
# STATIC CHECKS
# ==============================================================================
# This repo is shell / zsh / make, not Python: no unit-test framework — the
# workflow only runs the standard static checks, on every push.
#   - shellcheck on real shell scripts (cheatsheets/*.sh are fcheat data files
#     parsed by awk, not executable shell — excluded)
#   - zsh -n on all zsh config files (syntax only, nothing is executed)
#   - .ps1 files stay 100% ASCII: PowerShell 5.1 reads a BOM-less script as
#     Windows-1252, where one non-ASCII byte (an em-dash) becomes a string
#     delimiter and breaks the whole file's parse
#   - make on the global makefile: reading it parses every make/*.mk include,
#     then the help menu is asserted (expected targets present, no doc drift
#     between the *_commands.sh cheatsheets and gmake help)
#   - documentation coverage: every make/*.mk module must have a
#     docs/make/<name>.md page, linked from the README index and listed in
#     the README project tree; every gmake target must appear in a cheatsheet;
#     every .github/workflows/*.yml must be named in the README
#   - templates.tsv format: every row must have 4 tab-separated columns and a
#     known tool (copier/cruft/ccds). The picker skips a malformed row and warns
#     on stderr, but only when someone runs fnew - this check never misses one

name: Static checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Shellcheck (real shell scripts)
        run: |
          find . -type f -name '*.sh' -not -path './zsh/cheatsheets/*' -print0 |
            xargs -0 -r shellcheck

      - name: Zsh syntax (zsh -n, no execution)
        run: |
          find zsh -type f \( -name '*.zsh' -o -name '.zshrc' \) -print0 |
            xargs -0 -r -n1 zsh -n

      - name: PowerShell scripts (ASCII only)
        run: |
          # tr deletes every ASCII byte: whatever is left is not ASCII. A BOM
          # would be flagged too, which is the intended reading of the rule.
          # find, not a ./*.ps1 glob: the rule must cover the whole tree, and a
          # root glob would silently stop checking anything below it.
          bad=0
          while IFS= read -r -d '' f; do
            if [ -n "$(LC_ALL=C tr -d '\000-\177' < "$f")" ]; then
              echo "::error file=${f}::non-ASCII byte found - keep .ps1 files 100% ASCII"
              bad=1
            fi
          done < <(find . -type f -name '*.ps1' -not -path './.git/*' -print0)
          exit $bad

      - name: Makefile parse + help menu
        run: |
          make -f zsh/gmake/global_makefile.mk help |
            sed 's/\x1b\[[0-9;]*m//g' > help.txt
          missing=0
          for target in test test-fast test-functional test-gcp \
                        lint lint-py lint-sh lint-format \
                        copier_project cruft_project \
                        cloudrun_deploy bigquery_show vm_create \
                        gcp_project_list gh_pr_create docker_build_local; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::target '${target}' missing from gmake help"
              missing=1
            }
          done
          exit $missing

      - name: Cheatsheet doc drift (*_commands.sh vs gmake help)
        run: |
          grep -oE 'gmake [a-zA-Z_-]+' zsh/cheatsheets/*_commands.sh |
            awk '{print $2}' | sort -u > documented.txt
          missing=0
          while read -r target; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::'${target}' documented in a *_commands.sh cheatsheet but missing from gmake help"
              missing=1
            }
          done < documented.txt
          exit $missing

      - name: Documentation coverage
        run: |
          missing=0
          # A module is fully documented when: its doc page exists, the README
          # index links it, and the README tree lists the .mk file
          for mk in zsh/gmake/make/*.mk; do
            name=$(basename "$mk" .mk)
            [ -f "docs/make/${name}.md" ] || {
              echo "::error::module '${name}' has no doc page (docs/make/${name}.md)"
              missing=1
            }
            grep -q "docs/make/${name}.md" README.md || {
              echo "::error::doc page of module '${name}' not linked from the README index"
              missing=1
            }
            grep -q "${name}.mk" README.md || {
              echo "::error::'${name}.mk' missing from the README project structure tree"
              missing=1
            }
          done
          # No orphan doc pages either
          for doc in docs/make/*.md; do
            name=$(basename "$doc" .md)
            [ -f "zsh/gmake/make/${name}.mk" ] || {
              echo "::error::orphan doc page: ${doc} has no matching module"
              missing=1
            }
          done
          # Every target visible in gmake help (except the menu itself) must
          # be documented in a *_commands.sh cheatsheet
          awk '/^  /{print $1}' help.txt | grep -vx -e help -e make > help_targets.txt
          while read -r target; do
            grep -q "gmake ${target}\b" zsh/cheatsheets/*_commands.sh || {
              echo "::error::target '${target}' not documented in any *_commands.sh cheatsheet"
              missing=1
            }
          done < help_targets.txt
          # Every workflow must be named in the README, so the CI section there
          # cannot silently lose one (same rule as the make/*.mk modules)
          for wf in .github/workflows/*.yml; do
            name=$(basename "$wf")
            grep -q "$name" README.md || {
              echo "::error::workflow '${name}' is not named in the README"
              missing=1
            }
          done
          exit $missing

      - name: Template catalog integrity (templates.tsv)
        run: |
          awk -F'\t' '
            /^[[:space:]]*(#|$)/ { next }
            {
              sub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              if (NF != 4) {
                print "Malformed row (4 tab-separated columns expected): " $0
                bad = 1
              } else if ($2 !~ /^(copier|cruft|ccds)$/) {
                print "Unknown tool: " $2 " (expected copier, cruft or ccds): " $0
                bad = 1
              }
            }
            END { exit bad }
          ' zsh/cheatsheets/templates.tsv
