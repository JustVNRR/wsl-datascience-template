# ==============================================================================
# THE SCAFFOLD PACK - MAKING A PROJECT
# ==============================================================================
# The act of creating a project: the `fnew` picker, the three gmake targets it
# delegates to, and the .env every project wants. It used to live in the python
# pack, where most of it was not python - a java row would have been copied into
# a project that the python pack then tried to make a venv for.
#
# It requires nobody and it is nobody's choice, like devops: it arrives with the
# first pack that needs it and leaves with the last one that does. It brings a
# tool (uv, which takes the template tools on demand) and the act itself, so it
# is neither of the two extremes a pack can be - and nothing outside its folder
# names it.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make, and the two do not agree on encodings.
PACK_DESCRIPTION := Project scaffolding: fnew, and the tools it drives on demand (about 70 MB)

# Not offered, in any list. A pack that makes projects is one only because a
# pack that needs a project exists: this one arrives with the pack that requires
# it, and leaves with the last one that does. Unticking it - if it had a box -
# would pull the act out from under a pack still installed.
PACK_VISIBLE := no

# What `build` prints on the welcome screen of a fresh instance, when this pack
# is installed. It travels with the command it names: the line used to be the
# python pack's, where `fnew` lived.
PACK_WELCOME := Run 'cd projects' and type 'fnew' to create your first project.

# No PACK_PACKAGES: the one tool this pack installs, uv, is not a Debian
# package. It lives in the user's own ~/.local/bin, install.sh puts it there,
# and install.sh still finds it when another pack installed it first.
