# ==============================================================================
# THE CLAUDE PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more. This file is the
# whole declaration: the folder under packs/ is the registration, and no other
# file in the repository names the pack.
#
# The folder is also the state. The socle loads packs/*/make/*.mk and asks
# nothing else, so a pack is installed exactly when its folder is in
# ~/.config/packs - which is where `.\wsl.ps1 add_pack` puts it, files and tool
# together. There is no binary to test and no variable to force.
#
# Claude Code, the agentic CLI, in the instance. It is a terminal program and
# nothing else - no window to put on the Windows desktop, no editor extension -
# and it installs itself under the user's own ~/.local, from Anthropic's own
# script: no apt package to take, no root, and no Node, which the image does not
# carry (the npm route would need it, so that route is not this one).

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make, and the two do not agree on encodings.
#
# The weight is measured, not guessed (container, 2026-09-29): 232 MiB for the
# one version installed, a single 243 MB binary. It says per version on purpose:
# the CLI keeps every version it installs, so the second one costs as much as
# the first - see docs/claude.md.
PACK_DESCRIPTION := Claude Code, the agentic CLI (about 230 MB per version kept)

# What apt will never see, declared like PACK_PACKAGES and read the same way: a
# neighbouring pack asks this line before taking a name away. `claude` is a
# binary in ~/.local/bin pointing into ~/.local/share/claude/versions/<version>
# - the same place uv lives for the other packs, and outside dpkg's graph
# entirely.
PACK_OUTSIDE_APT := claude

# No PACK_PACKAGES: nothing this pack installs comes from apt.
# No PACK_REQUIRES: it stands alone, like vision and web.
