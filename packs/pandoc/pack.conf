# ==============================================================================
# THE PANDOC PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more. This file is the
# whole declaration: the folder under packs/ is the registration, and no other
# file in the repository names the pack.
#
# The folder is also the state. The socle loads packs/*/make/*.mk and asks
# nothing else, so a pack is installed exactly when its folder is in
# ~/.config/packs - which is where `.\wsl.ps1 add_pack` puts it, files and tool
# together.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make, and the two do not agree on encodings.
# The weight is measured, not guessed: 115 packages, 792 MB installed
# (Ubuntu 24.04, 2026-09-29) - four fifths of it texlive-latex-extra.
PACK_DESCRIPTION := Pandoc and XeLaTeX: Markdown to PDF and Word, bibliography included (about 800 MB installed)

# The system packages this pack brings, named once: install.sh installs them,
# remove.sh removes them, and a neighbouring pack reads this line before taking
# one away - a package another installed pack still claims stays where it is.
#
#   - pandoc: the converter itself. --citeproc is part of the binary, so the
#     bibliography needs no package of its own;
#   - texlive-xetex: the xelatex engine - the one a template that sets its own
#     font with fontspec asks for;
#   - texlive-latex-extra: the LaTeX packages a template of this kind calls
#     for - tcolorbox, titlesec, enumitem, xurl, csquotes...;
#   - texlive-fonts-recommended: the base PostScript fonts. Measured: hyperref
#     asks for pzdr (ZapfDingbats) the moment it sets up links under XeTeX, and
#     without this package the build stops on the missing font;
#   - texlive-lang-french: babel-french, for the documents written in French;
#   - fontconfig: fc-cache, the tool install.sh runs to register the fonts it
#     copies (the library behind it arrives with xetex; the tool does not);
#   - poppler-utils: the PDF tools the work ends up asking for beside the
#     build - pdftotext (what a PDF really contains), pdfinfo (pages, size),
#     pdftoppm (a page as an image), and pdfunite, which merges several PDFs
#     into one (a document and its annexes, one file to send).
#
# Only programs here, never a library, and nothing is ever installed with
# autoremove: a library that a neighbouring program depends on would take that
# program with it.
#
# Arial is not here, and cannot be: no package carries it in a form apt would
# install unattended (ttf-mscorefonts-installer accepts an EULA and downloads
# from a mirror). install.sh copies it from the Windows side instead - see its
# own comments - and remove.sh takes that copy back.
PACK_PACKAGES := pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-french fontconfig poppler-utils
