# ==============================================================================
# THE GCP PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more. This file is the
# whole declaration: the folder under packs/ is the registration, and no other
# file in the repository names the pack.

PACK_NAME := gcp

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make, and the two do not agree on encodings.
PACK_DESCRIPTION := The Google Cloud CLI (about 409 MB installed)

# The binary that decides. Present, the socle loads make/*.mk; absent, it loads
# install.mk. Everything the pack offers hangs on that one test — the way the
# gmake menu follows the machine.
PACK_GATE := gcloud

# The targets that stay reachable from anywhere: installing the tool, signing
# in to it, listing what the account can see — the ones a user needs before
# there is a project to stand in.
PACK_GATE_EXEMPT_GOALS := gcp_install gcp_uninstall gcp_auth_cli gcp_auth_libs gcp_project_list

# The variables that identify a project. Never allowed in a shared .env.global,
# where one of them would silently retarget every project at once.
PACK_IDENTIFYING_VARS := GCP_PROJECT INSTANCE SA_NAME BUCKET_NAME BQ_DATASET TABLE_NAME GAR_IMAGE ARTIFACTSREPO SERVICE_URL
