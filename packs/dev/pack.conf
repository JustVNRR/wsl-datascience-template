# ==============================================================================
# THE DEV PACK - THE PROJECT WORKSPACE
# ==============================================================================
# The targets that only make sense once a project exists: build its image, push
# its branch, assemble the .env files it reads. They used to live in the socle,
# where they were offered to an instance that had nothing to build - a project
# workspace with no way to make a project.
#
# This is the mirror of the vision pack: vision brings a tool and no target,
# `dev` brings targets and no tool. Everything it drives is already on the
# machine - docker comes from Docker Desktop, gh from the image - so there is
# nothing to install and nothing to take back.
#
# No PACK_PACKAGES, for that reason: a field nothing reads is not a safety. The
# two scripts say why they have nothing to do, and a neighbour's removal (which
# looks for a package name in the packs still installed) finds none in here.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make, and the two do not agree on encodings.
PACK_DESCRIPTION := Project targets: Docker, GitHub PRs, the environment files

# Not offered, in any list. A project workspace is one only because a pack that
# makes projects exists: this pack arrives with the pack that requires it, and
# leaves with the last one that does. Unticking it - if it had a box - would
# pull the base out from under a pack still installed, which is the whole
# reason it has none.
PACK_VISIBLE := no

# The variables refused in a shared .env.global: they identify ONE project, and
# this is the pack whose targets read them. The socle named this list before;
# it names none now, and every pack declares its own share.
PACK_IDENTIFYING_VARS := DOCKER_LOCAL_IMAGE
