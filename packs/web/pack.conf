# ==============================================================================
# THE WEB PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more. This file is the
# whole declaration: the folder under packs/ is the registration, and no other
# file in the repository names the pack.
#
# The folder is also the state. The socle loads packs/*/make/*.mk and asks
# nothing else, so a pack is installed exactly when its folder is in
# ~/.config/packs - which is where `.\wsl.ps1 add_pack` puts it, files and tool
# together.
#
# Two halves that share nothing but the machine they live on: a browser inside
# the instance (WSLg puts its window on the Windows desktop) and a WireGuard
# tunnel to Proton VPN, the user's own recipe, driven by six targets. The browser
# brings a command and no target - a browser is not a project's business - and
# the tunnel brings targets and no command. Both pages are in docs/.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make, and the two do not agree on encodings.
# The weight is measured, not guessed: a container install of the pack added
# 100 Debian packages and 459 MB, of which Firefox alone is 317 MB.
PACK_DESCRIPTION := Firefox, and a WireGuard tunnel to Proton VPN (about 460 MB installed)

# The system packages this pack brings, named once: install.sh installs them,
# remove.sh removes them, and a neighbouring pack reads this line before taking
# one away - a package another installed pack still claims stays where it is.
#
# Each one has its reason, and two of them are the kind that only show up later:
#   - firefox, from Mozilla's own repository - on Ubuntu 24.04 the package of
#     that name is a transitional one that installs the snap. install.sh
#     registers the repository, its key and its pins first; remove.sh takes all
#     four back.
#   - dbus-x11, because the image carries no session bus (no dbus-daemon, no
#     dbus-launch) and Firefox without one never opens its first window.
#   - wireguard-tools, iproute2 and iptables: wg-quick, and the firewall its
#     kill switch is written in.
#   - kmod, which nobody thinks about: the WireGuard driver is a kernel module,
#     WSL keeps it loaded in the VM it shares between distros, and the module
#     goes with that VM at the next `wsl --shutdown`. Without `modprobe` - which
#     is kmod - the next `wg-quick up` fails on "Unknown device type".
#   - openresolv, the one that does not come from apt: Ubuntu 24.04 has no such
#     package (22.04 does). install.sh takes it from Debian's archive, after
#     removing systemd-resolved, which provides the same `resolvconf` command
#     and makes the Debian package refuse to install. remove.sh takes it back
#     with `dpkg -r`.
#
# Only programs here, never a library, and nothing is ever installed with
# autoremove: a library that a neighbouring program depends on would take that
# program with it.
PACK_PACKAGES := firefox dbus-x11 wireguard-tools kmod iproute2 iptables openresolv
