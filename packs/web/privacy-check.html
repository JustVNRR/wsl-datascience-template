<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What this browser actually does</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  p.note { font-size: 0.85rem; opacity: 0.8; max-width: 44rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; margin-top: 1rem; }
  th, td { border: 1px solid #8884; padding: 0.35rem 0.6rem; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
  td.ok { color: #2e7d32; font-weight: 700; }
  td.bad { color: #c62828; font-weight: 700; }
  td.value { font-family: ui-monospace, monospace; word-break: break-all; }
  footer { font-size: 0.85rem; opacity: 0.8; margin-top: 1rem; }
</style>
</head>
<body>
<h1>What this browser actually does</h1>
<p class="note">Open <code>about:config</code> to consult Firefox's preferences.</p>
<table>
  <thead>
    <tr><th>Measured live</th><th>Value</th><th>Expected</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<footer>
  <span id="exit-ip">Exit IP: asking…</span><br>
  <span id="dns-line">DNS: …</span>
</footer>

<script>
"use strict";

// The launcher puts the set in the fragment, and the resolver it read from the
// instance: #strict;dns=10.2.0.1 (or #light;dns=1.1.1.1, or nothing at all).
const parts = decodeURIComponent(location.hash.slice(1)).split(";");
const set = parts[0] || "";
const dns = (parts.find(p => p.startsWith("dns=")) || "dns=").slice(4);
const strict = set === "strict";
document.title += set ? " - " + set : "";

const rows = document.getElementById("rows");

// One line of the table. expected/verdict are left out when no set was passed.
// verdict: true, false, or null for "no promise either way".
function add(name, value, expected, verdict) {
  const tr = document.createElement("tr");
  tr.innerHTML = "<td>" + name + "</td><td class='value'></td><td></td><td></td>";
  tr.children[1].textContent = value === "" ? "(empty)" : value;
  if (strict) tr.children[2].textContent = expected;
  if (strict && verdict !== null && verdict !== undefined) {
    tr.children[3].textContent = verdict ? "✓" : "✗";
    tr.children[3].className = verdict ? "ok" : "bad";
  }
  rows.appendChild(tr);
  return tr;
}

function later(row, value, verdict) {
  row.children[1].textContent = value;
  if (strict && verdict !== null && verdict !== undefined) {
    row.children[3].textContent = verdict ? "✓" : "✗";
    row.children[3].className = verdict ? "ok" : "bad";
  }
}

// --- the time zone: RFP hands every site Reykjavik (UTC+0), since Firefox 128
// (before that it was the rare name "UTC" itself) -----------------------------
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
add("Time zone", tz, "Atlantic/Reykjavik (UTC+0)", tz === "Atlantic/Reykjavik");

// --- the language Firefox announces ------------------------------------------
add("Language", navigator.language, "en-US", navigator.language === "en-US");

// --- the user-agent: the plain Firefox one, nothing custom. Since the UA
// reduction (Firefox 120) everyone's Firefox sends this same reduced shape,
// and the platform in it is the real one - hiding Linux is the old behaviour.
const ua = navigator.userAgent;
add(
  "User-agent",
  ua,
  "the plain Firefox UA, nothing custom",
  /^Mozilla\/5\.0 \([^)]*\) Gecko\/20100101 Firefox\/[\d.]+$/.test(ua)
);

// --- what a site sees of the window: RFP rounds it to 200 x 100 ---------------
add(
  "Window size a site sees",
  window.innerWidth + " × " + window.innerHeight,
  "a multiple of 200 × 100",
  window.innerWidth % 200 === 0 && window.innerHeight % 100 === 0
);

// --- WebRTC: gone with the strict set ----------------------------------------
const rtc = typeof RTCPeerConnection;
add("RTCPeerConnection", rtc, "undefined", rtc === "undefined");

// --- the canvas: RFP replaces every read with fresh random bytes (the "poison
// pill"), so reading twice gives two different pictures - a real canvas gives
// the same one every time ------------------------------------------------
function canvasHash() {
  const c = document.createElement("canvas");
  c.width = 200; c.height = 50;
  const g = c.getContext("2d");
  g.textBaseline = "top";
  g.font = "16px monospace";
  g.fillStyle = "#f60";
  g.fillRect(0, 0, 200, 50);
  g.fillStyle = "#069";
  g.fillText("fingerprint me", 2, 2);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let h = 0;
  for (let i = 0; i < d.length; i += 17) h = (h * 31 + d[i]) | 0;
  return (h >>> 0).toString(16);
}
let canvasVerdict, canvasOk;
try {
  const h1 = canvasHash();
  const h2 = canvasHash();
  if (h1 !== h2) { canvasVerdict = "random on every read - neutralized"; canvasOk = true; }
  else { canvasVerdict = "stable on two reads (" + h1 + ") - readable"; canvasOk = false; }
} catch (e) {
  canvasVerdict = "unreadable (" + e.name + ")";
  canvasOk = true;
}
add("Canvas, read twice", canvasVerdict, "random on every read", canvasOk);

// --- geolocation: asked, and answered -----------------------------------------
const geoRow = add("Geolocation (asked just now)", "asking…", "refused", null);
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    () => later(geoRow, "granted", false),
    (e) => later(geoRow, e.code === 1 ? "refused (denied)" : "failed (" + e.message + ")", e.code === 1),
    { timeout: 4000 }
  );
} else {
  later(geoRow, "no geolocation API", true);
}

// --- a real tracker, with a control request: doubleclick.com is a classic
// blocker target, example.com never is. If the control goes through and the
// tracker does not, tracking content is being blocked. If both go through,
// this local page is simply not the place where the shield acts - said so,
// instead of guessing. (itisatracker.com is Mozilla's own test site, kept
// off the lists on purpose - a poor pick, tried first.) ------------------------
const trackerRow = add("doubleclick.net (a classic tracker)", "asking…", "blocked", null);
const probe = url =>
  fetch(url, { mode: "no-cors", cache: "no-store" }).then(() => "loaded", () => "not loaded");
Promise.all([probe("https://www.doubleclick.net/"), probe("https://example.com/")]).then(
  ([tracker, control]) => {
    if (control === "not loaded") later(trackerRow, "not conclusive (the network is down)", null);
    else if (tracker === "not loaded") later(trackerRow, tracker + " - tracking content blocked", true);
    else later(trackerRow, "loaded like the control - not conclusive from a local page", null);
  }
);

// --- what the internet sees right now, and the resolver: the footer -----------
const ipLine = document.getElementById("exit-ip");
fetch("https://ipinfo.io/json")
  .then(r => r.json())
  .then(j => {
    const place = [j.city, j.region, j.country].filter(Boolean).join(", ");
    ipLine.textContent = "Exit IP: " + (j.ip || "?") + (place ? " - " + place : "") + (j.org ? " (" + j.org + ")" : "");
  })
  .catch(() => {
    // ipinfo may not answer (or not allow a page opened from a file): the IP
    // alone still comes from ipify, which does.
    fetch("https://api.ipify.org?format=json")
      .then(r => r.json())
      .then(j => { ipLine.textContent = "Exit IP: " + j.ip + " (location service unavailable)"; })
      .catch(() => { ipLine.textContent = "Exit IP: unreachable"; });
  });

document.getElementById("dns-line").textContent = "DNS: " + (dns || "(not passed by the launcher)");

</script>
</body>
</html>
