# ==============================================================================
# THE PYTHON PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more. This file is the
# whole declaration: the folder under packs/ is the registration, and no other
# file in the repository names the pack.
#
# The folder is also the state. The socle loads packs/*/make/*.mk and asks
# nothing else, so a pack is installed exactly when its folder is in
# ~/.config/packs - which is where `.\wsl.ps1 add_pack` puts it, files and tool
# together.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make, and the two do not agree on encodings.
# The weight is measured, not guessed: 331 MB of Debian packages, and about
# 200 MB under ~/.local (uv, the interpreter it downloads, ruff).
PACK_DESCRIPTION := Python 3, uv, ruff and the compilation tools (about 530 MB installed)

# What this pack is installed on top of. Two packs, each for a reason of its
# own:
#   - devops: the projects this pack makes usable are the ones its targets
#     build, push and configure - a project with no docker command and no pull
#     request is a project nobody ships;
#   - scaffold: the act of creating a project (the picker, the three targets,
#     the .env) is not python's, and this pack is one of the packs that needs
#     it. It comes with fnew, and it is what calls init_venv back, through the
#     SCAFFOLD_AFTER_python declaration in make/venv.mk.
PACK_REQUIRES := devops scaffold

# No PACK_WELCOME: the line a fresh instance prints points at `fnew`, which is
# the scaffold pack's command - the sentence travels with what it names.

# The system packages this pack brings, named once: install.sh installs them,
# remove.sh removes them, and a neighbouring pack reads this line before taking
# one away - a package another installed pack still claims stays where it is.
#
# These four are the compiler and the headers most Python wheels are built
# against (numpy, pandas, psycopg2 and friends): without them a project falls
# back to a precompiled wheel or fails to build at all.
#
# uv is not here, and cannot be: it is not a Debian package. install.sh puts it
# in the user's own ~/.local/bin - when it is not already there, the scaffold
# pack having installed it first - and remove.sh names it by hand. That is also
# why the image no longer carries it: a Python toolchain that is not there is a
# toolchain a machine does not pay for.
#
# Only programs here, never a library, and nothing is ever installed with
# autoremove: a library that a neighbouring program depends on would take that
# program with it.
PACK_PACKAGES := build-essential python3-dev libffi-dev libssl-dev
